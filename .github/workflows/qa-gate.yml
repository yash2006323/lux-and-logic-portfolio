name: QA gate
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pre-publish checks
        run: python3 scripts/qa_check.py
